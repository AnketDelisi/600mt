name: Update midterms data

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Scrape races, polls and run the model
        run: |
          python scraper/us_scrape_races.py
          python scraper/us_scrape_polls.py
          python scraper/us_scrape_model.py

      - name: Commit and push
        run: |
          git config user.name "600 bot"
          git config user.email "600@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update midterms data $(date -u +%Y-%m-%d)"
          git push
